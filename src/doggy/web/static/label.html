<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#171310" />
<title>watchdoggy · label</title>
<style>
  :root{
    --night:#171310; --walnut:#211b15; --panel2:#2a2219; --seam:#372e23;
    --linen:#efe7d8; --stone:#9e9179; --lamp:#e2a23b; --lamp-soft:#f0be6b;
    --ember:#e4572e; --moss:#8ea56a; --sky:#5a8bd6;
    --serif:"Iowan Old Style","Palatino","Book Antiqua",Georgia,serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--night);color:var(--linen);font-family:var(--sans);
       line-height:1.5;padding:env(safe-area-inset-top) 0 2rem;
       -webkit-tap-highlight-color:transparent}
  .wrap{max-width:820px;margin:0 auto;padding:1rem}
  :focus-visible{outline:2px solid var(--lamp);outline-offset:2px;border-radius:4px}

  header{padding-bottom:.7rem;margin-bottom:.9rem}
  .head-row{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;
       flex-wrap:wrap}
  .mark{font-family:var(--serif);font-style:italic;font-size:1.3rem}
  .mark a{color:var(--linen);text-decoration:none}
  .menu{display:flex;gap:1.1rem;font-family:var(--mono);font-size:.66rem;
       text-transform:uppercase;letter-spacing:.18em}
  .menu a{color:var(--stone);text-decoration:none;padding-bottom:.15rem}
  .menu a.on{color:var(--lamp);border-bottom:1.5px solid var(--lamp)}
  .menu a:hover{color:var(--linen)}
  #progress{font-family:var(--mono);font-size:.7rem;letter-spacing:.14em;color:var(--stone)}
  #bar{height:3px;background:var(--seam);border-radius:99px;margin-top:.6rem;overflow:hidden}
  #bar div{height:100%;width:0%;background:var(--lamp);border-radius:99px;transition:width .4s}

  /* Filter chips */
  #chips{display:flex;gap:.45rem;flex-wrap:wrap;margin-bottom:.8rem}
  .chip{font-family:var(--mono);font-size:.64rem;letter-spacing:.08em;
        text-transform:uppercase;padding:.32rem .6rem;border-radius:99px;
        border:1px solid var(--seam);background:transparent;color:var(--stone);
        cursor:pointer}
  .chip:hover{border-color:var(--lamp);color:var(--lamp)}
  .chip.on{border-color:var(--lamp);color:var(--lamp);
        box-shadow:0 0 0 1px var(--lamp) inset}
  .chip .n{opacity:.7;margin-left:.3rem}
  .chip.warn{border-color:var(--ember);color:var(--ember)}
  .chip.warn.on{box-shadow:0 0 0 1px var(--ember) inset}

  /* Stage */
  #stage{position:relative;border:1px solid var(--seam);border-radius:10px;overflow:hidden;
         background:#000;line-height:0;cursor:zoom-in}
  #stage.zoomed{cursor:zoom-out}
  #stage.boxmode{cursor:crosshair;touch-action:none}
  #frame{width:100%;display:block;transition:transform .18s ease;transform-origin:center}
  #boxes{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;
         transition:transform .18s ease;transform-origin:center}
  #flash{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
         font-family:var(--serif);font-style:italic;font-size:2rem;pointer-events:none;
         opacity:0;background:rgba(23,19,16,.45)}
  #flash.show{animation:flashfade .55s ease-out}
  @keyframes flashfade{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
  #empty{display:none;text-align:center;padding:2.5rem 1rem;
         font-family:var(--serif);font-style:italic;font-size:1.15rem;color:var(--stone)}

  /* Filmstrip */
  #stripwrap{display:flex;align-items:center;gap:.3rem;margin-top:.55rem}
  .chev{font:inherit;font-size:1.1rem;line-height:1;padding:.9rem .45rem;
        border-radius:8px;border:1px solid var(--seam);background:transparent;
        color:var(--stone);cursor:pointer;flex:none}
  .chev:hover{color:var(--lamp);border-color:var(--lamp)}
  #strip{display:flex;gap:.4rem;overflow-x:auto;scrollbar-width:thin;
         scroll-behavior:smooth;flex:1;padding:.15rem}
  .thumb{position:relative;flex:none;width:86px;border-radius:7px;overflow:hidden;
         border:2px solid var(--seam);cursor:pointer;line-height:0}
  .thumb img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
  .thumb.v-dog{border-color:var(--moss)}
  .thumb.v-dog_mixed{border-color:var(--lamp)}
  .thumb.v-person{border-color:var(--ember)}
  .thumb.v-no_dog{border-color:var(--ember)}
  .thumb.v-skip{opacity:.55}
  .thumb.on{border-color:var(--linen);box-shadow:0 0 0 1.5px var(--linen)}
  .thumb .hb{position:absolute;top:.2rem;right:.2rem;width:.5rem;height:.5rem;
        border:1.5px solid var(--lamp);border-radius:2px;background:rgba(23,19,16,.65)}

  #why{font-family:var(--mono);font-size:.68rem;letter-spacing:.12em;color:var(--stone);
       margin:.55rem 0 .9rem;text-transform:uppercase;display:flex;justify-content:space-between;
       gap:1rem;flex-wrap:wrap}
  #hint_sug{color:var(--lamp-soft)}

  /* Verdicts */
  .btns{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem}
  .btns button{font:inherit;font-weight:650;font-size:1rem;padding:.9rem .4rem;
       border-radius:10px;border:1.5px solid var(--seam);background:var(--walnut);
       color:var(--linen);cursor:pointer;touch-action:manipulation;
       transition:transform .06s, box-shadow .2s}
  .btns button:active{transform:scale(.97)}
  .btns button .k{display:block;font-family:var(--mono);font-weight:500;font-size:.62rem;
       letter-spacing:.12em;color:var(--stone);margin-top:.25rem}
  .btns button .sub{display:block;font-weight:400;font-size:.68rem;
       color:var(--stone);margin-top:.3rem;line-height:1.3}
  #btn_dog{border-color:var(--moss);color:var(--moss)}
  #btn_mixed{border-color:var(--lamp);color:var(--lamp)}
  #btn_person{border-color:var(--ember);color:var(--ember)}
  #btn_empty{color:var(--stone)}
  .btns button.suggested{box-shadow:0 0 0 1px currentColor, 0 0 14px -2px currentColor}
  .btns button.current{box-shadow:0 0 0 2px currentColor}
  .underrow{display:flex;justify-content:space-between;align-items:center;margin-top:.7rem;
       gap:.5rem;flex-wrap:wrap}
  .underrow button{font:inherit;font-size:.8rem;padding:.4rem .8rem;border-radius:8px;
       border:1px solid var(--seam);background:transparent;color:var(--stone);cursor:pointer}
  .underrow button:hover{color:var(--lamp);border-color:var(--lamp)}
  .underrow button:disabled{opacity:.4;cursor:default}
  #tally{font-family:var(--mono);font-size:.68rem;letter-spacing:.1em;color:var(--stone)}

  /* Box editor */
  #boxbar{display:none}
  #task.boxmode .btns, #task.boxmode .underrow{display:none}
  #task.boxmode #boxbar{display:block}
  #boxbar .row1{display:flex;gap:.6rem}
  #boxbar .row1 button{flex:1;font:inherit;font-weight:650;font-size:.95rem;
       padding:.75rem .4rem;border-radius:10px;border:1.5px solid var(--seam);
       background:var(--walnut);color:var(--linen);cursor:pointer;touch-action:manipulation}
  #cls_dog.on{border-color:var(--moss);color:var(--moss);
       box-shadow:0 0 0 1px var(--moss)}
  #cls_person.on{border-color:var(--sky);color:var(--sky);
       box-shadow:0 0 0 1px var(--sky)}
  #bx_save{border-color:var(--lamp);color:var(--lamp)}
  #boxbar .row2{display:flex;gap:.6rem;margin-top:.55rem;flex-wrap:wrap}
  #boxbar .row2 button{font:inherit;font-size:.78rem;padding:.4rem .75rem;
       border-radius:8px;border:1px solid var(--seam);background:transparent;
       color:var(--stone);cursor:pointer}
  #boxbar .row2 button:hover{color:var(--lamp);border-color:var(--lamp)}
  #boxbar .row2 button:disabled{opacity:.35;cursor:default}
  #boxhint{font-family:var(--mono);font-size:.6rem;letter-spacing:.11em;
       color:var(--stone);margin-top:.55rem;text-transform:uppercase}

  @media(max-width:560px){
    .btns{grid-template-columns:1fr 1fr}
    .btns button .k{display:none}
    .thumb{width:72px}
  }
  @media(prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="head-row">
      <span class="mark"><a href="/">watchdoggy</a> · label</span>
      <nav class="menu"><a href="/">Dashboard</a><a href="/label" class="on">Label</a>
        <a href="/training">Training</a></nav>
      <span id="progress">–</span>
    </div>
    <div id="bar"><div></div></div>
  </header>

  <div id="chips"></div>

  <div id="task">
    <div id="stage" onclick="toggleZoom(event)">
      <img id="frame" alt="captured frame" />
      <canvas id="boxes"></canvas>
      <div id="flash"></div>
    </div>
    <div id="empty">nothing here — pick another filter</div>
    <div id="stripwrap">
      <button class="chev" onclick="step(-1)" aria-label="previous frame">&#8249;</button>
      <div id="strip"></div>
      <button class="chev" onclick="step(1)" aria-label="next frame">&#8250;</button>
    </div>
    <div id="why"><span id="why_text"></span><span id="hint_sug"></span></div>
    <div class="btns">
      <button id="btn_dog" onclick="verdict('dog')">Dog in frame
        <span class="sub">person there too? still this one</span><span class="k">D</span></button>
      <button id="btn_mixed" onclick="verdict('dog_mixed')">Dog + bad box
        <span class="sub">real dog, but a “dog” box sits on a person</span><span class="k">M</span></button>
      <button id="btn_person" onclick="verdict('person')">Person only
        <span class="sub">no dog anywhere in frame</span><span class="k">P</span></button>
      <button id="btn_empty" onclick="verdict('empty')">Nothing
        <span class="sub">no dog, no person</span><span class="k">B</span></button>
    </div>
    <div class="underrow">
      <button onclick="verdict('skip')">Skip (S)</button>
      <button onclick="enterBoxMode()">Fix boxes (F)</button>
      <span id="tally"></span>
      <button id="undo_btn" onclick="undo()" disabled>Undo (U)</button>
    </div>
    <div id="boxbar">
      <div class="row1">
        <button id="cls_dog" class="on" onclick="setCls('dog')">Dog box (1)</button>
        <button id="cls_person" onclick="setCls('person')">Person box (2)</button>
        <button id="bx_save" onclick="saveBoxes()">Save boxes (Enter)</button>
      </div>
      <div class="row2">
        <button onclick="seedMachine()">Copy machine boxes</button>
        <button id="bx_del" onclick="deleteSel()" disabled>Delete selected (&#9003;)</button>
        <button onclick="clearAllBoxes()">Clear all</button>
        <button onclick="exitBoxMode()">Cancel (Esc)</button>
      </div>
      <div id="boxhint">drag on empty space to draw · tap a box to select ·
        drag it to move · corners resize · box every dog and person</div>
    </div>
  </div>
</div>

<script>
// One fixed stage; a filterable filmstrip does the navigating. No page
// scrolling to relabel -- pick a chip, arrow through, verdict with keys.
let filter = "unlabeled";
let frames = [];          // light rows for the current filter
let idx = -1;             // position in frames
let current = null;       // full sample detail shown on the stage
let counts = {};
let undoStack = [];
let session = 0;
let zoomed = false;
let busy = false;

const CHIP_DEFS = [
  ["unlabeled", "Queue"], ["needs_boxes", "Needs boxes"],
  ["no_prelabels", "No ·x"], ["dog", "Dog"], ["dog_mixed", "Dog+bad box"],
  ["person", "Person"], ["empty", "Nothing"], ["skip", "Skipped"], ["all", "All"],
];
const VERDICT_WORDS = {dog:"Dog", dog_mixed:"Dog + bad box", person:"Person only",
                       empty:"Nothing", no_dog:"Not a dog", skip:"Skipped"};
const VERDICT_BTN = {dog:"btn_dog", dog_mixed:"btn_mixed", person:"btn_person",
                     empty:"btn_empty", no_dog:"btn_person"};
const REASON_WORDS = {fire:"fired the alarm", suppressed:"a dog box was suppressed",
  borderline:"the model was unsure", person_activity:"someone was in the kitchen",
  periodic:"background frame", user_marked_fp:"marked from the catch log",
  fire_context:"moments before an alarm"};

function esc(s){ return String(s).replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

// -- filters + filmstrip ----------------------------------------------------
function renderChips(){
  document.getElementById("chips").innerHTML = CHIP_DEFS.map(([key, word]) => {
    const warn = key === "needs_boxes" && counts[key] > 0;
    return '<button class="chip' + (filter === key ? " on" : "")
      + (warn ? " warn" : "") + '" onclick="setFilter(\'' + key + '\')">'
      + word + '<span class="n">' + (counts[key] ?? 0) + '</span></button>';
  }).join("");
}
function renderStrip(){
  document.getElementById("strip").innerHTML = frames.map((f, i) =>
    '<div class="thumb' + (f.verdict ? " v-" + esc(f.verdict) : "")
    + (i === idx ? " on" : "") + '" data-i="' + i + '">'
    + '<img loading="lazy" src="' + esc(f.image) + '" alt="">'
    + (f.hand_boxes ? '<div class="hb"></div>' : '') + '</div>').join("");
  const active = document.querySelector("#strip .thumb.on");
  if (active) active.scrollIntoView({block: "nearest", inline: "center"});
}
document.getElementById("strip").addEventListener("click", e => {
  const t = e.target.closest(".thumb");
  if (t) select(parseInt(t.dataset.i, 10));
});

async function loadFrames(keep = "index"){
  let d;
  try { d = await (await fetch("/api/dataset/frames?filter=" + filter)).json(); }
  catch(e){ return; }
  const prevName = (frames[idx] || {}).name;
  frames = d.frames; counts = d.counts;
  const total = counts.all || 0;
  const done = total - (counts.unlabeled || 0);
  document.getElementById("progress").textContent =
    (counts.unlabeled || 0) + " TO GO · " + done + " DONE";
  document.getElementById("bar").firstElementChild.style.width =
    total ? (100 * done / total) + "%" : "0%";
  renderChips();
  if (!frames.length){ idx = -1; current = null; showEmpty(true); renderStrip(); return; }
  showEmpty(false);
  let next = 0;
  if (keep === "name" && prevName){
    const found = frames.findIndex(f => f.name === prevName);
    next = found >= 0 ? found : Math.min(Math.max(idx, 0), frames.length - 1);
  }
  if (keep === "index") next = Math.min(Math.max(idx, 0), frames.length - 1);
  select(next);
}
function setFilter(key){
  filter = key; idx = -1;
  if (boxMode) exitBoxMode();
  loadFrames();
}
function step(delta){
  if (!frames.length) return;
  select((idx + delta + frames.length) % frames.length);
}
function showEmpty(on){
  document.getElementById("stage").style.display = on ? "none" : "";
  document.getElementById("empty").style.display = on ? "block" : "none";
}

// -- stage ------------------------------------------------------------------
async function select(i){
  if (i < 0 || i >= frames.length) return;
  if (boxMode) exitBoxMode();
  exitZoom();
  idx = i;
  renderStrip();
  let d;
  try { d = await (await fetch("/api/dataset/sample/" + frames[i].name)).json(); }
  catch(e){ return; }
  current = d;
  const img = document.getElementById("frame");
  img.onload = drawBoxes;
  img.src = d.image;
  let why = (d.reasons || []).map(r => REASON_WORDS[r] || r).join(" · ");
  if (Array.isArray(d.human_boxes)) why += " · hand boxes saved";
  if (d.verdict) why += " · labeled: " + (VERDICT_WORDS[d.verdict] || d.verdict);
  document.getElementById("why_text").textContent = "Saved because: " + (why || "unknown");
  const sugKey = d.suggested === "no_dog" ? "person" : d.suggested;
  document.getElementById("hint_sug").textContent =
    (!d.verdict && sugKey && VERDICT_WORDS[sugKey])
      ? "machine hint: " + VERDICT_WORDS[sugKey].toLowerCase() : "";
  for (const [v, id] of Object.entries(VERDICT_BTN)){
    const btn = document.getElementById(id);
    btn.classList.toggle("suggested", !d.verdict && sugKey === v);
    btn.classList.toggle("current", d.verdict === v);
  }
}

function drawBoxes(){
  const img = document.getElementById("frame");
  const canvas = document.getElementById("boxes");
  canvas.width = img.clientWidth; canvas.height = img.clientHeight;
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (!current) return;
  const sx = img.clientWidth / img.naturalWidth, sy = img.clientHeight / img.naturalHeight;
  const det = current.detections || {};

  const machine = (dets, color, faint) => (dets || []).forEach(d => {
    const [x1, y1, x2, y2] = d.box;
    ctx.save();
    if (faint){ ctx.globalAlpha = 0.45; ctx.setLineDash([5, 4]); }
    ctx.strokeStyle = color; ctx.lineWidth = 2;
    ctx.strokeRect(x1*sx, y1*sy, (x2-x1)*sx, (y2-y1)*sy);
    if (!faint){
      ctx.fillStyle = color; ctx.font = "12px ui-monospace,monospace";
      ctx.fillText(d.label + " " + Math.round(d.confidence*100) + "%", x1*sx + 3, y1*sy + 13);
    }
    ctx.restore();
  });
  const hand = (boxes, showHandles) => (boxes || []).forEach((b, i) => {
    const [x1, y1, x2, y2] = b.box;
    const color = CLS_COLOR[b.label] || "#efe7d8";
    const sel = showHandles && i === selBox;
    ctx.strokeStyle = color; ctx.lineWidth = sel ? 3 : 2.5;
    ctx.strokeRect(x1*sx, y1*sy, (x2-x1)*sx, (y2-y1)*sy);
    ctx.fillStyle = color; ctx.font = "600 12px ui-monospace,monospace";
    ctx.fillText(b.label, x1*sx + 3, y1*sy + 13);
    if (sel){
      for (const [cx, cy] of [[x1,y1],[x2,y1],[x1,y2],[x2,y2]])
        ctx.fillRect(cx*sx - 5, cy*sy - 5, 10, 10);
    }
  });
  const pre = (boxes_, tag) => (boxes_ || []).forEach(b => {
    const [x1, y1, x2, y2] = b.box;
    const color = CLS_COLOR[b.label] || "#efe7d8";
    ctx.strokeStyle = color; ctx.lineWidth = 2.5;
    ctx.strokeRect(x1*sx, y1*sy, (x2-x1)*sx, (y2-y1)*sy);
    ctx.fillStyle = color; ctx.font = "600 12px ui-monospace,monospace";
    ctx.fillText(b.label + tag, x1*sx + 3, y1*sy + 13);
  });

  const humanSaved = Array.isArray(current.human_boxes) && current.human_boxes.length;
  const preBoxes = (current.prelabels && current.prelabels.boxes) || null;
  if (boxMode){
    machine(det.targets, "#e4572e", true);
    machine(det.suppressed, "#9e9179", true);
    machine(det.people, "#5a8bd6", true);
    hand(editBoxes, true);
    if (drag && drag.kind === "draw" && drag.cur){
      const r = normRect(drag.anchor, drag.cur);
      ctx.save();
      ctx.setLineDash([6, 4]); ctx.strokeStyle = CLS_COLOR[activeCls]; ctx.lineWidth = 2;
      ctx.strokeRect(r[0]*sx, r[1]*sy, (r[2]-r[0])*sx, (r[3]-r[1])*sy);
      ctx.restore();
    }
  } else if (humanSaved){
    machine(det.targets, "#e4572e", true);
    machine(det.people, "#5a8bd6", true);
    hand(current.human_boxes, false);
  } else if (preBoxes){
    machine(det.targets, "#e4572e", true);
    machine(det.people, "#5a8bd6", true);
    pre(preBoxes, " ·x");
  } else {
    machine(det.targets, "#e4572e", false);
    machine(det.suppressed, "#9e9179", false);
    machine(det.people, "#5a8bd6", false);
  }
}

// -- box editor -------------------------------------------------------------
let boxMode = false, editBoxes = [], selBox = -1, activeCls = "dog", drag = null;
const CLS_COLOR = {dog:"#8ea56a", person:"#5a8bd6"};
const stageEl = document.getElementById("stage");

function natCoords(e){
  const img = document.getElementById("frame");
  const r = img.getBoundingClientRect();
  return [Math.max(0, Math.min(img.naturalWidth,
            (e.clientX - r.left) / r.width * img.naturalWidth)),
          Math.max(0, Math.min(img.naturalHeight,
            (e.clientY - r.top) / r.height * img.naturalHeight))];
}
function natPerPx(){
  const img = document.getElementById("frame");
  return img.naturalWidth / img.getBoundingClientRect().width;
}
function normRect(a, b){
  return [Math.min(a[0], b[0]), Math.min(a[1], b[1]),
          Math.max(a[0], b[0]), Math.max(a[1], b[1])];
}
function machineSeed(){
  const pre = (current && current.prelabels && current.prelabels.boxes) || null;
  if (pre && pre.length) return pre.map(b => ({label: b.label, box: [...b.box]}));
  const det = (current && current.detections) || {};
  return [...(det.targets || []).map(d => ({label: "dog", box: [...d.box]})),
          ...(det.people || []).map(d => ({label: "person", box: [...d.box]}))];
}
function enterBoxMode(){
  if (!current || boxMode) return;
  exitZoom();
  boxMode = true; selBox = -1; drag = null;
  editBoxes = (Array.isArray(current.human_boxes) ? current.human_boxes
               : machineSeed()).map(b => ({label: b.label, box: [...b.box]}));
  document.getElementById("task").classList.add("boxmode");
  stageEl.classList.add("boxmode");
  updateBoxbar(); drawBoxes();
}
function exitBoxMode(){
  boxMode = false; drag = null; selBox = -1;
  document.getElementById("task").classList.remove("boxmode");
  stageEl.classList.remove("boxmode");
  drawBoxes();
}
function setCls(c){
  activeCls = c;
  if (selBox >= 0){ editBoxes[selBox].label = c; }
  updateBoxbar(); drawBoxes();
}
function seedMachine(){
  editBoxes = machineSeed().map(b => ({label: b.label, box: [...b.box]}));
  selBox = -1; updateBoxbar(); drawBoxes();
}
function deleteSel(){
  if (selBox < 0) return;
  editBoxes.splice(selBox, 1); selBox = -1;
  updateBoxbar(); drawBoxes();
}
function clearAllBoxes(){ editBoxes = []; selBox = -1; updateBoxbar(); drawBoxes(); }
function updateBoxbar(){
  document.getElementById("cls_dog").classList.toggle("on", activeCls === "dog");
  document.getElementById("cls_person").classList.toggle("on", activeCls === "person");
  document.getElementById("bx_del").disabled = selBox < 0;
}
function hitBox(p){
  let best = -1, bestArea = Infinity;
  const pad = 4 * natPerPx();
  editBoxes.forEach((b, i) => {
    const [x1, y1, x2, y2] = b.box;
    if (p[0] >= x1 - pad && p[0] <= x2 + pad && p[1] >= y1 - pad && p[1] <= y2 + pad){
      const area = (x2 - x1) * (y2 - y1);
      if (area < bestArea){ bestArea = area; best = i; }
    }
  });
  return best;
}
function hitHandle(p){
  if (selBox < 0) return null;
  const [x1, y1, x2, y2] = editBoxes[selBox].box;
  const t = 14 * natPerPx();
  for (const [cx, cy, fixed] of [[x1,y1,[x2,y2]], [x2,y1,[x1,y2]],
                                 [x1,y2,[x2,y1]], [x2,y2,[x1,y1]]])
    if (Math.abs(p[0] - cx) < t && Math.abs(p[1] - cy) < t) return fixed;
  return null;
}
stageEl.addEventListener("pointerdown", e => {
  if (!boxMode || !current) return;
  e.preventDefault();
  stageEl.setPointerCapture(e.pointerId);
  const p = natCoords(e);
  const fixed = hitHandle(p);
  if (fixed){ drag = {kind: "resize", fixed}; return; }
  const i = hitBox(p);
  if (i >= 0){
    selBox = i;
    drag = {kind: "maybemove", anchor: p, orig: [...editBoxes[i].box]};
  } else {
    selBox = -1;
    drag = {kind: "draw", anchor: p, cur: null};
  }
  updateBoxbar(); drawBoxes();
});
stageEl.addEventListener("pointermove", e => {
  if (!boxMode || !drag) return;
  e.preventDefault();
  const p = natCoords(e);
  if (drag.kind === "draw"){ drag.cur = p; }
  else if (drag.kind === "maybemove" || drag.kind === "move"){
    const dx = p[0] - drag.anchor[0], dy = p[1] - drag.anchor[1];
    if (drag.kind === "maybemove" && Math.hypot(dx, dy) < 4 * natPerPx()) return;
    drag.kind = "move";
    const img = document.getElementById("frame");
    const [x1, y1, x2, y2] = drag.orig;
    const w = x2 - x1, h = y2 - y1;
    const nx = Math.max(0, Math.min(img.naturalWidth - w, x1 + dx));
    const ny = Math.max(0, Math.min(img.naturalHeight - h, y1 + dy));
    editBoxes[selBox].box = [nx, ny, nx + w, ny + h];
  }
  else if (drag.kind === "resize"){
    editBoxes[selBox].box = normRect(drag.fixed, p);
  }
  drawBoxes();
});
stageEl.addEventListener("pointerup", e => {
  if (!boxMode || !drag) return;
  if (drag.kind === "draw" && drag.cur){
    const r = normRect(drag.anchor, drag.cur);
    if (r[2] - r[0] > 8 && r[3] - r[1] > 8){
      editBoxes.push({label: activeCls, box: r});
      selBox = editBoxes.length - 1;
    }
  }
  drag = null;
  updateBoxbar(); drawBoxes();
});
async function saveBoxes(){
  if (!current || busy) return;
  const boxes = editBoxes.map(b => ({label: b.label,
                                     box: b.box.map(v => Math.round(v * 10) / 10)}));
  const v = boxes.some(b => b.label === "dog") ? "dog"
          : boxes.some(b => b.label === "person") ? "person" : "empty";
  exitBoxMode();
  await submitLabel({name: current.name, verdict: v, boxes},
                    "Boxes saved · " + VERDICT_WORDS[v]);
}

// -- zoom -------------------------------------------------------------------
function toggleZoom(e){
  if (boxMode) return;
  const stage = document.getElementById("stage");
  const img = document.getElementById("frame");
  const boxes = document.getElementById("boxes");
  if (zoomed){ exitZoom(); return; }
  const r = stage.getBoundingClientRect();
  const ox = ((e.clientX - r.left) / r.width) * 100;
  const oy = ((e.clientY - r.top) / r.height) * 100;
  for (const el of [img, boxes]){
    el.style.transformOrigin = ox + "% " + oy + "%";
    el.style.transform = "scale(2.2)";
  }
  stage.classList.add("zoomed"); zoomed = true;
}
function exitZoom(){
  zoomed = false;
  document.getElementById("stage").classList.remove("zoomed");
  for (const id of ["frame", "boxes"]) document.getElementById(id).style.transform = "";
}

// -- verdicts ---------------------------------------------------------------
async function submitLabel(body, word){
  if (busy) return;
  busy = true;
  try {
    await fetch("/api/dataset/label", {method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify(body)});
  } finally { busy = false; }
  session++;
  undoStack.push({name: body.name});
  document.getElementById("undo_btn").disabled = false;
  document.getElementById("tally").textContent = session + " this session";
  flash(word);
  // In the queue the labeled frame leaves the filter, so keeping the index
  // lands on the next frame; in verdict filters the frame may stay put.
  loadFrames("index");
}
function verdict(v){
  if (!current) return;
  submitLabel({name: current.name, verdict: v}, VERDICT_WORDS[v] || v);
}
async function undo(){
  const last = undoStack.pop();
  document.getElementById("undo_btn").disabled = undoStack.length === 0;
  if (!last) return;
  await fetch("/api/dataset/label", {method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({name: last.name, verdict: "clear"})});
  session = Math.max(0, session - 1);
  document.getElementById("tally").textContent = session ? session + " this session" : "";
  loadFrames("index");
}
function flash(word){
  const f = document.getElementById("flash");
  f.textContent = word;
  f.classList.remove("show");
  void f.offsetWidth;
  f.classList.add("show");
}

// -- keys -------------------------------------------------------------------
document.addEventListener("keydown", e => {
  if (boxMode){
    if (e.key === "Escape") exitBoxMode();
    else if (e.key === "Enter") saveBoxes();
    else if (e.key === "1") setCls("dog");
    else if (e.key === "2") setCls("person");
    else if (e.key === "Backspace" || e.key === "Delete"){
      e.preventDefault(); deleteSel();
    }
    return;  // verdict keys must never fire mid-annotation
  }
  if (e.key === "ArrowLeft"){ step(-1); return; }
  if (e.key === "ArrowRight"){ step(1); return; }
  const k = e.key.toLowerCase();
  if (k === "d") verdict("dog");
  else if (k === "m") verdict("dog_mixed");
  else if (k === "p") verdict("person");
  else if (k === "b") verdict("empty");
  else if (k === "s") verdict("skip");
  else if (k === "u") undo();
  else if (k === "f") enterBoxMode();
});
window.addEventListener("resize", drawBoxes);
loadFrames();
</script>
