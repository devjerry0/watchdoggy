<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#171310" />
<title>watchdoggy · training</title>
<style>
  :root{
    --night:#171310; --walnut:#211b15; --panel2:#2a2219; --seam:#372e23;
    --linen:#efe7d8; --stone:#9e9179; --lamp:#e2a23b; --lamp-soft:#f0be6b;
    --ember:#e4572e; --moss:#8ea56a; --sky:#5a8bd6;
    --serif:"Iowan Old Style","Palatino","Book Antiqua",Georgia,serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--night);color:var(--linen);font-family:var(--sans);
       line-height:1.5;padding:env(safe-area-inset-top) 0 2rem;
       -webkit-tap-highlight-color:transparent}
  .wrap{max-width:820px;margin:0 auto;padding:1rem}
  :focus-visible{outline:2px solid var(--lamp);outline-offset:2px;border-radius:4px}

  header{padding-bottom:.7rem;margin-bottom:1.2rem;border-bottom:1px solid var(--seam)}
  .head-row{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;
       flex-wrap:wrap}
  .mark{font-family:var(--serif);font-style:italic;font-size:1.3rem}
  .mark a{color:var(--linen);text-decoration:none}
  .menu{display:flex;gap:1.1rem;font-family:var(--mono);font-size:.66rem;
       text-transform:uppercase;letter-spacing:.18em}
  .menu a{color:var(--stone);text-decoration:none;padding-bottom:.15rem}
  .menu a.on{color:var(--lamp);border-bottom:1.5px solid var(--lamp)}
  .menu a:hover{color:var(--linen)}

  h2{font-family:var(--mono);font-size:.66rem;font-weight:600;text-transform:uppercase;
     letter-spacing:.24em;color:var(--stone);margin:1.6rem 0 .7rem;
     padding-bottom:.5rem;border-bottom:1px solid var(--seam)}
  .line{font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;
        color:var(--stone);margin:.3rem 0}
  .line b{color:var(--lamp);font-weight:600}
  .line .good{color:var(--moss)} .line .bad{color:var(--ember)}

  /* Recipe + schedule forms */
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
        gap:.7rem;margin:.6rem 0}
  .field label{display:block;font-family:var(--mono);font-size:.6rem;
        text-transform:uppercase;letter-spacing:.14em;color:var(--stone);
        margin-bottom:.3rem}
  .field input[type=number]{width:100%;font:inherit;font-size:.95rem;
        padding:.45rem .6rem;border-radius:8px;border:1px solid var(--seam);
        background:var(--walnut);color:var(--linen)}
  .field.check{display:flex;align-items:center;gap:.5rem;padding-top:1.1rem}
  .field.check label{margin:0}
  .row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin:.7rem 0}
  .row button{font:inherit;font-size:.82rem;font-weight:600;padding:.55rem .95rem;
        border-radius:8px;border:1.5px solid var(--seam);background:var(--walnut);
        color:var(--linen);cursor:pointer}
  .row button.primary{border-color:var(--lamp);color:var(--lamp)}
  .row button.quiet{font-weight:400;background:transparent;color:var(--stone);
        border-width:1px}
  .row button:hover{border-color:var(--lamp);color:var(--lamp)}
  #msg{font-family:var(--mono);font-size:.66rem;color:var(--moss)}

  /* Log + report viewers */
  pre{font-family:var(--mono);font-size:.66rem;line-height:1.5;color:var(--linen);
      background:var(--walnut);border:1px solid var(--seam);border-radius:8px;
      padding:.9rem;overflow-x:auto;white-space:pre-wrap;max-height:24rem;
      overflow-y:auto}
  #log_pre{color:var(--stone)}

  /* History */
  .jobrow{display:flex;gap:.8rem;align-items:baseline;flex-wrap:wrap;
       font-family:var(--mono);font-size:.68rem;letter-spacing:.05em;
       color:var(--stone);padding:.35rem 0;border-top:1px dashed var(--seam)}
  .jobrow .k-train{color:var(--lamp)} .jobrow .k-prelabel{color:var(--sky)}
  .jobrow .s-done{color:var(--moss)} .jobrow .s-failed{color:var(--ember)}
  .jobrow .s-running{color:var(--lamp-soft)} .jobrow .s-queued{color:var(--stone)}
  .jobrow a{color:var(--lamp);cursor:pointer;text-decoration:underline}

  @media(prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="head-row">
      <span class="mark"><a href="/">watchdoggy</a> · training</span>
      <nav class="menu"><a href="/">Dashboard</a><a href="/label">Label</a>
        <a href="/training" class="on">Training</a></nav>
    </div>
  </header>

  <h2>Status</h2>
  <div class="line" id="st_counts">–</div>
  <div class="line" id="st_active">–</div>
  <div class="line" id="st_next">–</div>

  <h2>Recipe — used by manual and scheduled runs</h2>
  <div class="grid">
    <div class="field"><label for="f_epochs">epochs</label>
      <input id="f_epochs" type="number" min="10" max="500"></div>
    <div class="field"><label for="f_batch">batch</label>
      <input id="f_batch" type="number" min="4" max="64"></div>
    <div class="field"><label for="f_freeze">freeze layers</label>
      <input id="f_freeze" type="number" min="0" max="23"></div>
    <div class="field check">
      <input id="f_augment" type="checkbox">
      <label for="f_augment">blur/dark augmentation</label></div>
  </div>

  <h2>Schedule</h2>
  <div class="grid">
    <div class="field"><label for="f_interval">train every (hours)</label>
      <input id="f_interval" type="number" min="6" max="336"></div>
    <div class="field"><label for="f_minlabels">min new labels</label>
      <input id="f_minlabels" type="number" min="1" max="100"></div>
    <div class="field"><label for="f_nightly">nightly prelabels at (hour)</label>
      <input id="f_nightly" type="number" min="0" max="23"></div>
  </div>
  <div class="row">
    <button class="quiet" onclick="saveSettings()">Save recipe + schedule</button>
    <button class="primary" onclick="runJob('train')">Run training now</button>
    <button onclick="runJob('prelabel')">Fetch ·x boxes now</button>
    <span id="msg"></span>
  </div>

  <h2>Run log</h2>
  <div class="line" id="log_which">no job selected — logs appear here while a run is active</div>
  <pre id="log_pre" hidden></pre>

  <h2>History</h2>
  <div id="jobs"></div>
  <div id="report_view" hidden>
    <div class="row"><button class="quiet"
      onclick="document.getElementById('report_view').hidden=true">Close report</button></div>
    <pre id="report_pre"></pre>
  </div>
</div>

<script>
let settingsLoaded = false;
let logJob = null;       // job id whose log is shown

function esc(s){ return String(s).replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function _ago(ts){
  const mins = Math.round((Date.now()/1000 - ts) / 60);
  if (mins < 60) return mins + "m ago";
  if (mins < 2880) return Math.round(mins/60) + "h ago";
  return Math.round(mins/1440) + "d ago";
}

const FIELDS = {epochs:"f_epochs", batch:"f_batch", freeze:"f_freeze",
                train_interval_hours:"f_interval", min_new_labels:"f_minlabels",
                nightly_prelabel_hour:"f_nightly"};

function fillSettings(s){
  for (const [key, id] of Object.entries(FIELDS))
    document.getElementById(id).value = s[key];
  document.getElementById("f_augment").checked = !!s.augment;
  settingsLoaded = true;
}
function readSettings(){
  const out = {augment: document.getElementById("f_augment").checked};
  for (const [key, id] of Object.entries(FIELDS))
    out[key] = parseInt(document.getElementById(id).value, 10);
  return out;
}
async function saveSettings(){
  const r = await fetch("/api/training/settings", {method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify(readSettings())});
  document.getElementById("msg").textContent =
    r.ok ? "saved — auto runs use these now" : "save failed: " + (await r.text());
}
async function runJob(kind){
  const body = {kind};
  if (kind === "train"){
    const s = readSettings();
    body.params = {epochs: s.epochs, batch: s.batch, freeze: s.freeze,
                   augment: s.augment};
  }
  const d = await (await fetch("/api/training/request", {method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify(body)})).json();
  document.getElementById("msg").textContent = d.already_pending
    ? "already queued — the trainer picks it up on its next pass (≤30 min)"
    : "queued — the trainer picks it up on its next pass (≤30 min)";
  refresh();
}

async function refresh(){
  let d;
  try { d = await (await fetch("/api/training/status")).json(); } catch(e){ return; }
  if (!settingsLoaded && d.settings) fillSettings(d.settings);

  document.getElementById("st_counts").innerHTML =
    "<b>" + d.unlabeled + "</b> unlabeled frames · <b>" + d.missing_prelabels
    + "</b> lack ·x boxes — <a style='color:var(--lamp)' href='/label'>go label</a>";
  const active = (d.jobs || []).find(j => j.status === "queued" || j.status === "running");
  document.getElementById("st_active").innerHTML = active
    ? "now: <b>" + esc(active.kind) + " " + esc(active.status) + "</b>"
      + (active.detail ? " — " + esc(active.detail) : "")
    : (d.last_train
       ? "last training " + _ago(d.last_train.updated_at) + " — "
         + (/DEPLOYED/.test(d.last_train.detail)
            ? "<span class='good'>" + esc(d.last_train.detail) + "</span>"
            : esc(d.last_train.detail))
       : "no training runs yet");
  document.getElementById("st_next").textContent = d.next_auto_train
    ? (d.next_auto_train < Date.now()/1000
       ? "next auto training: on the trainer's next pass"
       : "next auto training in ~"
         + Math.max(1, Math.round((d.next_auto_train - Date.now()/1000)/3600)) + "h")
    : "next auto training: after the first run completes";

  document.getElementById("jobs").innerHTML = (d.jobs || []).map(j =>
    '<div class="jobrow"><span>' + _ago(j.updated_at) + '</span>'
    + '<span class="k-' + esc(j.kind) + '">' + esc(j.kind) + '</span>'
    + '<span class="s-' + esc(j.status) + '">' + esc(j.status) + '</span>'
    + (j.auto ? '<span>auto</span>' : '')
    + (j.detail ? '<span>' + esc(j.detail) + '</span>' : '')
    + '<a onclick="showLog(\'' + esc(j.id) + '\')">log</a>'
    + (j.kind === "train" && j.status === "done"
       ? '<a onclick="showReport(\'' + esc(j.id) + '\')">report</a>' : '')
    + '</div>').join("");

  if (!logJob && active && active.status === "running") showLog(active.id);
  if (logJob) pollLog();
}

async function showLog(jobId){
  logJob = jobId;
  document.getElementById("log_which").textContent = "log · " + jobId;
  pollLog();
}
async function pollLog(){
  if (!logJob) return;
  const r = await fetch("/api/training/log/" + logJob);
  const pre = document.getElementById("log_pre");
  if (!r.ok){ pre.hidden = false; pre.textContent = "(no log yet)"; return; }
  const text = await r.text();
  const stick = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 20;
  pre.hidden = false;
  pre.textContent = text || "(empty)";
  if (stick) pre.scrollTop = pre.scrollHeight;
}
async function showReport(jobId){
  const r = await fetch("/api/training/report/" + jobId);
  if (!r.ok) return;
  document.getElementById("report_pre").textContent = await r.text();
  document.getElementById("report_view").hidden = false;
  document.getElementById("report_view").scrollIntoView({behavior: "smooth"});
}

setInterval(refresh, 10000);
refresh();
</script>
</body>
</html>
